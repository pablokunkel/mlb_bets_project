# =============================================================================
# revalidate-picks.yml — pre-game re-check of the published card.
#
# Audit 2026-08-21 P0-1 / P1-4, shipped 2026-09-07. The daily-picks cron is
# 13:07 UTC and, with GH Actions drift, fires anywhere from ~13:30 to ~23:00
# UTC; most days it scores on yesterday's batting order (the recent-lineup
# fallback). 2026-06-03 → 09-06, 38 of 738 published picks (5.1%) never
# played: not in the posted lineup, or the game was postponed after the run.
#
# This workflow runs revalidate_picks.py twice a day, before the two first-
# pitch clusters (day games ~1 PM ET, night games ~7 PM ET). It re-fetches
# the schedule + posted lineups, swaps any pick that is scratched / in a
# dead game for the next-best batter on the stored board (games already in
# progress are left alone), re-exports the site JSON, and pushes — only
# when something actually changed. If the morning run has not happened yet
# (drift), there are no rows for today and the script is a no-op.
#
# Cron minutes are off-peak (:37 / :07) for the same drift reason as
# daily-picks.yml. Same `hr-bets-db` concurrency group so it never overlaps
# a DB-writing workflow.
# =============================================================================

name: Revalidate picks (pre-game)

on:
  workflow_dispatch:
    inputs:
      date:
        description: Date to revalidate (YYYY-MM-DD, blank = today UTC)
        required: false
        default: ""
      dry_run:
        description: Plan + log only, no DB write / push
        required: false
        default: "false"

  schedule:
    # 16:37 UTC = 12:37 PM ET (EDT): before the ~1:05 PM ET day games.
    - cron: "37 16 * * *"
    # 21:07 UTC = 5:07 PM ET (EDT): before the ~6:40-7:10 PM ET night games.
    - cron: "7 21 * * *"

concurrency:
  group: hr-bets-db
  cancel-in-progress: false

permissions:
  contents: write   # pushes the refreshed site JSON to main when the card changed

jobs:
  revalidate:
    runs-on: ubuntu-latest
    if: github.repository == 'pablokunkel/mlb_bets_project'
    timeout-minutes: 20

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up env + pull DB
        uses: ./.github/actions/setup-mlb-env
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}

      - name: Resolve date
        id: date
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            d="${{ inputs.date }}"
          else
            d=$(date -u +%Y-%m-%d)
          fi
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "Resolved date: $d"

      # The script is fail-soft (exit 0 on any crash) and prints
      # REVALIDATE_CHANGED=1 only when it rewrote daily_picks.
      - name: Revalidate today's card
        id: reval
        shell: bash
        run: |
          set -o pipefail
          extra=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then extra="--dry-run"; fi
          python revalidate_picks.py --date "${{ steps.date.outputs.date }}" $extra | tee reval.log
          if grep -q '^REVALIDATE_CHANGED=1' reval.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-export site data
        if: steps.reval.outputs.changed == 'true'
        run: python export_site_data.py

      - name: Commit + push site data
        if: steps.reval.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add mlb_hr_bet_site/data/*.json || true
          git commit -m "Revalidate picks ${{ steps.date.outputs.date }}" --allow-empty
          git pull --rebase --autostash origin main
          git push origin main

      - name: Push hr_bets.db back to R2
        if: success() && steps.reval.outputs.changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python infra/r2_sync.py push
